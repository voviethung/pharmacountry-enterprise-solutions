      - "8095:3000"
    environment:
      FRAPPE_BASE_URL: http://host.docker.internal:8082
      FRAPPE_SITE_HOST: pharmacountry.vn
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web-06-online-pharmacy:
